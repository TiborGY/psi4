jobs:
# Configure, build, install, and test job
- job: 'linux_build'
  displayName: 'Linux Builds'
  timeoutInMinutes: 120
  variables:
    CTEST_OUTPUT_ON_FAILURE: 1
    MKL_CBWR: AUTO
  strategy:
    maxParallel: 8
    matrix:
      gcc_10:
        # oldest GCC that cmake/custom_cxxstandard.cmake accepts. LIBSTDCXX_GCC_VER makes the lane link *and*
        #   run against GCC 10's own libstdc++ rather than a newer one from Ubuntu or conda-forge.
        #   See "Special Operation: use GCC's own libstdc++".
        CXX_COMPILER: 'g++-10'
        PYTHON_VER: '3.14'
        C_COMPILER: 'gcc-10'
        F_COMPILER: 'gfortran-10'
        BUILD_TYPE: 'release'
        APT_INSTALL: 'gcc-10 g++-10 gfortran-10'
        # pinned: Ubuntu stopped packaging gcc-10 after 24.04, so this can't follow ubuntu-latest
        vmImage: 'ubuntu-24.04'
        PYTEST_MARKER_EXPR: "(quick and not memory_profiler)"
        PYTEST_NAME_EXPR: 'not nonsense1'
        # c-f einsums needs a newer libstdc++ (GLIBCXX_3.4.31) than GCC 10 provides
        ENABLE_EINSUMS: "OFF"
        ENABLE_GAUXC: "ON"
        CMARGS: ""
        CM_GENERATOR: "Ninja"
        ADVISOR_ARGS: ""
        ADVISOR_DISABLE_ARGS: "compilers"
        LIBSTDCXX_GCC_VER: '10'

      gcc_11:
        CXX_COMPILER: 'g++-11'
        PYTHON_VER: '3.14'
        C_COMPILER: 'gcc-11'
        F_COMPILER: 'gfortran'
        BUILD_TYPE: 'release'
        APT_INSTALL: 'gfortran gcc-11 g++-11'
        vmImage: 'ubuntu-latest'
        PYTEST_MARKER_EXPR: "(quick and not memory_profiler)"
        PYTEST_NAME_EXPR: 'not nonsense1'
        ENABLE_EINSUMS: "ON"
        ENABLE_GAUXC: "ON"
        CMARGS: ""
        CM_GENERATOR: "Ninja"
        ADVISOR_ARGS: ""
        ADVISOR_DISABLE_ARGS: "compilers"

      gcc_latest:
        CXX_COMPILER: 'g++'
        PYTHON_VER: '3.14'
        C_COMPILER: 'gcc'
        F_COMPILER: 'gfortran'
        BUILD_TYPE: 'release'
        APT_INSTALL: 'gfortran'
        vmImage: 'ubuntu-24.04'
        PYTEST_MARKER_EXPR: '((api and not stdsuite and not (smoke or quick or medlong or long or memory_profiler)) or einsums)'
        PYTEST_NAME_EXPR: 'not nonsense1'
        ENABLE_EINSUMS: "ON"
        ENABLE_GAUXC: "ON"
        CMARGS: >-
          -Dpsi4_ENABLE_PRECOMPILE_HEADERS=OFF
          -Dpsi4_CMAKE_UNITY_BUILD=OFF
          -DCMAKE_CXX_FLAGS_RELEASE:STRING='-O2 -DNDEBUG'
        CM_GENERATOR: "Unix Makefiles"
        ADVISOR_ARGS: ""
        ADVISOR_DISABLE_ARGS: "compilers"

      clang_latest:
        CXX_COMPILER: 'clang++-21'
        PYTHON_VER: '3.11'
        C_COMPILER: 'clang-21'
        F_COMPILER: 'gfortran'
        BUILD_TYPE: 'release'
        APT_INSTALL: 'gfortran clang-21 clang++-21'
        # needed by gauxc 'libomp-15-dev' leads to needing `export KMP_DUPLICATE_LIB_OK=TRUE`
        vmImage: 'ubuntu-latest'
        PYTEST_MARKER_EXPR: 'cli and not (smoke or quick or medlong or long or memory_profiler)'
        PYTEST_NAME_EXPR: 'not nonsense1'
        ENABLE_EINSUMS: "OFF"
        ENABLE_GAUXC: "OFF"
        CMARGS: >-
          -DOpenMP_C_FLAGS=-fopenmp=libomp
          -DOpenMP_CXX_FLAGS=-fopenmp=libomp
          -DOpenMP_C_LIB_NAMES=omp
          -DOpenMP_CXX_LIB_NAMES=omp
          -DOpenMP_omp_LIBRARY=/home/runner/miniforge3/envs/p4env/lib/libomp.so
          -Dpsi4_ENABLE_PRECOMPILE_HEADERS=ON
        CM_GENERATOR: "Ninja"
        ADVISOR_ARGS: ""
        ADVISOR_DISABLE_ARGS: "compilers"

      clang_py314:
        CXX_COMPILER: 'clang++-17'
        PYTHON_VER: '3.14'
        C_COMPILER: 'clang-17'
        F_COMPILER: 'gfortran'
        BUILD_TYPE: 'release'
        APT_INSTALL: 'gfortran clang-17 clang++-17'
        vmImage: 'ubuntu-latest'
        PYTEST_MARKER_EXPR: '(quick and not memory_profiler)'
        PYTEST_NAME_EXPR: 'not nonsense1'
        ENABLE_EINSUMS: "ON"
        ENABLE_GAUXC: "ON"
        CMARGS: >-
          -DOpenMP_C_FLAGS=-fopenmp=libomp
          -DOpenMP_CXX_FLAGS=-fopenmp=libomp
          -DOpenMP_C_LIB_NAMES=omp
          -DOpenMP_CXX_LIB_NAMES=omp
          -DOpenMP_omp_LIBRARY=/home/runner/miniforge3/envs/p4env/lib/libomp.so
        CM_GENERATOR: "Ninja"
        ADVISOR_ARGS: ""
        ADVISOR_DISABLE_ARGS: "compilers"

      icpx_conda:
        CXX_COMPILER: 'icpx'
        PYTHON_VER: '3.12'
        C_COMPILER: 'icx'
        F_COMPILER: 'ifx'
        BUILD_TYPE: 'release'
        APT_INSTALL: ''
        vmImage: 'ubuntu-latest'
        # todo
        PYTEST_MARKER_EXPR: '((api and not stdsuite and not (smoke or quick or medlong or long)) or einsums)'
        PYTEST_NAME_EXPR: 'not nonsense1'
        ENABLE_EINSUMS: "OFF"
        ENABLE_GAUXC: "OFF"
        CMARGS: >-
          -DENABLE_XHOST=OFF
          -Dpsi4_ENABLE_PRECOMPILE_HEADERS=ON
        CM_GENERATOR: "Ninja"
        ADVISOR_ARGS: "--compiler IntelLLVM"
        ADVISOR_DISABLE_ARGS: ""

  pool:
    vmImage: $(vmImage)

  steps:
  - bash: |
      [[ "${APT_REPOSITORY}" ]] && echo "Add Repo ${APT_REPOSITORY}" && sudo add-apt-repository "${APT_REPOSITORY}"
      sudo apt-get update
      sudo apt-get install ${APT_INSTALL}
    displayName: "Apt-Get Packages"

  - bash: |
      echo "" && echo "Ubuntu"
      lsb_release -a

      echo "" && echo "Uname:"
      uname -a

      echo "" && echo "Free:"
      free -m

      echo "" && echo "df:"
      df -h

      echo "" && echo "Ulimit:"
      ulimit -a

      echo "" && echo "Nprocs:"
      getconf _NPROCESSORS_ONLN

      if [[ "$(Agent.JobName)" != "Linux Builds icpx_conda" ]]; then
        echo "CXX Ver:"
        ${CXX_COMPILER} --version
        ${CXX_COMPILER} -v

        echo "F Ver:"
        ${F_COMPILER} --version

        echo "C Ver:"
        ${C_COMPILER} --version
      fi
    displayName: "Setup Information"

  - bash: |
      set -e
      if [[ -z "${CONDA:-}" || ! -x "$CONDA/bin/conda" ]]; then
        export CONDA="$HOME/miniforge3"
        curl -fsSL -o miniforge.sh \
          https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
        bash miniforge.sh -b -p "$CONDA"
      fi
      export PATH="$CONDA/bin:$PATH"
      echo "##vso[task.setvariable variable=CONDA]$CONDA"
      echo "##vso[task.prependpath]$CONDA/bin"
      conda --version
      conda config --set always_yes yes
      # conda config --set solver libmamba
    displayName: "Add Conda to PATH"

  - bash: |
      set -e
      if [[ -n "${LIBSTDCXX_GCC_VER:-}" ]]; then
        # Ubuntu ships only the newest GCC's libstdc++.so.6 (GCC 14's on 24.04), so an apt-installed older g++
        #   compiles against its own headers but links and runs against that newer library. Fetch the older
        #   GCC's own runtime (for GCC 10: libstdc++.so.6.0.28, GLIBCXX_3.4.28) into a separate prefix ...
        prefix="$(Agent.BuildDirectory)/libstdcxx-gcc${LIBSTDCXX_GCC_VER}"
        conda create -p "${prefix}" -c conda-forge --override-channels "libstdcxx-ng=${LIBSTDCXX_GCC_VER}"
        libstdcxx=$(readlink -f "${prefix}/lib/libstdc++.so.6")
        # ... and make it the libstdc++ the compiler links against (its libstdc++.so linker symlink points at
        #   the system one)
        cxx_link=$(${CXX_COMPILER} -print-file-name=libstdc++.so)
        [[ "${cxx_link}" == /* ]]
        sudo ln -sfv "${libstdcxx}" "${cxx_link}"
        # test steps LD_PRELOAD it, the only way to ensure no other libstdc++.so.6 gets into the process:
        #   c-f binaries (python included) carry DT_RPATH to the env, which beats LD_LIBRARY_PATH.
        echo "##vso[task.setvariable variable=LIBSTDCXX_SO]${libstdcxx}"
      fi
    displayName: "Special Operation: use GCC's own libstdc++"

  - bash: |
      grep OPENORBITALOPTIMIZER psi4/src/read_options.cc
      if [[ "$(Agent.JobName)" == "Linux Builds gcc_latest" ]]; then
        sed -i 's;\(options\.add_str("ORBITAL_OPTIMIZER_PACKAGE", "\)INTERNAL\(", "INTERNAL OOO OPENORBITALOPTIMIZER"\);\1OOO\2;' psi4/src/read_options.cc
      fi
      grep OPENORBITALOPTIMIZER psi4/src/read_options.cc
    displayName: "Special Operation: test OpenOrbitalOptimizer"

  - bash: |
      grep '"INTEGRAL_PACKAGE"' psi4/src/read_options.cc
      if [[ "$(Agent.JobName)" == "Linux Builds gcc_11" ]]; then
        sed -i 's;\(options\.add_str("INTEGRAL_PACKAGE", "\)LIBINT2\(", "LIBINT2 SIMINT LIBCINT"\);\1LIBCINT\2;' psi4/src/read_options.cc
      fi
      grep '"INTEGRAL_PACKAGE"' psi4/src/read_options.cc
    displayName: "Special Operation: test libcint as default integral package"

  - bash: |
      conda install pyyaml -c conda-forge
      conda/psi4-path-advisor.py \
        env \
        --name p4env \
        --python $PYTHON_VER \
        --disable ${ADVISOR_DISABLE_ARGS} addons docs
      echo "\n<<<  env_p4env.yaml  >>>\n"
      cat env_p4env.yaml
      # test some alternative packages
      if [[ "$(Agent.JobName)" == "Linux Builds icpx_conda" ]]; then
        sed -i "s;#- dpcpp;- dpcpp;g" env_p4env.yaml
        sed -i "s;#- ifx;- ifx;g" env_p4env.yaml
      fi
      sed -i "s;- libint;#- libint;g" env_p4env.yaml
      sed -i "s;#- psi4::libint;- psi4::libint=2.8.1;g" env_p4env.yaml
      if [[ -z "${LIBSTDCXX_GCC_VER:-}" ]]; then
        # c-f einsums can't load with an older GCC's libstdc++
        echo "  - einsums>=1.0.6" >> env_p4env.yaml
      fi
      echo "  - range-v3" >> env_p4env.yaml
      echo "  - zlib" >> env_p4env.yaml
      echo "  - armadillo" >> env_p4env.yaml
      echo "  - openorbitaloptimizer" >> env_p4env.yaml
      echo "  - libcint" >> env_p4env.yaml
      echo "\n<<<  env_p4env.yaml  >>>\n"
      cat env_p4env.yaml
      conda env create -n p4env -f env_p4env.yaml
      source activate p4env
      if [[ -n "${LIBSTDCXX_GCC_VER:-}" ]]; then
        # c-f builds of numpy, scipy, pandas (C++ extensions) and cmake (ctest runs in the test steps) need a newer
        #   libstdc++ (GLIBCXX_3.4.29+) than GCC 10's. PyPI's manylinux wheels are limited to old symbol versions,
        #   so swap them in, keeping conda's versions of the Python packages.
        pins=$(python -c "from importlib.metadata import version; print(*(f'{p}=={version(p)}' for p in ['numpy', 'scipy', 'pandas']))")
        pip install --no-deps --force-reinstall --only-binary=:all: cmake ${pins} || exit 1
        # drop the env's linker symlink to its (newer) libstdc++, so a -L${CONDA_PREFIX}/lib can't divert linking
        #   from the compiler's one. The runtime libstdc++.so.6 stays, as conda's own tools need it.
        rm -fv "${CONDA_PREFIX}/lib/libstdc++.so"
      fi
      conda info
      conda list
    displayName: 'Build Environment'

  - bash: |
      source activate p4env
      python -V
      python -c 'import numpy; print(numpy.version.version)'
      conda/psi4-path-advisor.py \
        cmake ${ADVISOR_ARGS} \
        --objdir build \
        --insist
      echo "\n<<<  cache_p4env@build.cmake  >>>\n"
      cat cache_p4env@build.cmake
      cmake \
        -S. \
        -B build \
        -C $(Build.SourcesDirectory)/cache_p4env@build.cmake \
        -G "${CM_GENERATOR}" \
        -D CMAKE_CXX_COMPILER=${CXX_COMPILER} \
        -D CMAKE_C_COMPILER=${C_COMPILER} \
        -D CMAKE_Fortran_COMPILER=${F_COMPILER} \
        -D CMAKE_BUILD_TYPE=${BUILD_TYPE} \
        -D ENABLE_PLUGIN_TESTING=ON \
        -D ENABLE_Einsums="${ENABLE_EINSUMS}" \
        -D ENABLE_IntegratorXX=OFF \
        -D ENABLE_gauxc="${ENABLE_GAUXC}" \
        -D ENABLE_OpenOrbitalOptimizer=ON \
        -D ENABLE_cint=ON \
        -D FORCE_PEDANTIC=ON \
        $(CMARGS) \
        -D CMAKE_INSTALL_PREFIX=$(Agent.BuildDirectory)/Install
    displayName: 'Configure Build'

    # conda remove qcengine --force || true
    # conda remove optking --force || true
  - bash: |
      cd build
      source activate p4env
      cmake --build . -- -j 2
      readelf -d ./stage/lib/psi4/core*.so
      ldd -v ./stage/lib/psi4/core*.so
    displayName: 'Build Psi4'

  - bash: |
      set -e
      if [[ -n "${LIBSTDCXX_SO:-}" ]]; then
        cd build
        source activate p4env
        # built against GCC's own libstdc++: headers by the compiler ...
        echo "#include <cstddef>" | ${CXX_COMPILER} -x c++ -dM -E - | grep -E "_GLIBCXX_RELEASE|__GLIBCXX__ "
        # ... and library by "Special Operation: use GCC's own libstdc++" (no other libstdc++.so linkable)
        readlink -f "$(${CXX_COMPILER} -print-file-name=libstdc++.so)"
        [[ "$(readlink -f "$(${CXX_COMPILER} -print-file-name=libstdc++.so)")" == "${LIBSTDCXX_SO}" ]]
        [[ ! -e "${CONDA_PREFIX}/lib/libstdc++.so" ]]
        # psi4 loads and runs with it as the only libstdc++ in the process (else "version `GLIBCXX_...' not found")
        LD_PRELOAD="${LIBSTDCXX_SO}" PYTHONPATH=stage/lib python -c "if True:
          import psi4
          psi4.core.be_quiet()
          psi4.geometry('He')
          print('He/sto-3g SCF energy', psi4.energy('scf/sto-3g'))
          libs = {l.split()[-1] for l in open('/proc/self/maps') if 'libstdc++' in l}
          print('libstdc++ in use:', *libs)
          assert libs == {'${LIBSTDCXX_SO}'}, libs"
      fi
    displayName: "Special Operation: check use of GCC's own libstdc++"

  - bash: |
      cd build
      source activate p4env
      if [[ -n "${LIBSTDCXX_SO:-}" ]]; then export LD_PRELOAD="${LIBSTDCXX_SO}"; fi
      python -V
      python -c "import qcengine as qcng; qcng.get_program('psi4')" || true
      python -c 'import numpy; print(numpy.version.version)'
      python -c 'import qcelemental as q; print(q.__version__, q.__file__)'
      python -c 'import qcengine as q; print(q.__version__, q.__file__)'
      qcengine info
      ./stage/bin/psi4 ../tests/tu1-h2o-energy/input.dat -o stdout
    displayName: 'Spot Test'

  - bash: |
      cd build
      source activate p4env
      if [[ -n "${LIBSTDCXX_SO:-}" ]]; then export LD_PRELOAD="${LIBSTDCXX_SO}"; fi
      python -V
      export PYTHONPATH=stage/lib
      export PATH=stage/bin:$PATH
      qcengine info
      python -c "import qcengine as qcng; qcng.get_program('psi4')" || true
      python -c 'import numpy; print(numpy.version.version)'
      python -c 'import qcelemental as q; print(q.__version__, q.__file__)'
      python -c 'import qcengine as q; print(q.__version__, q.__file__)'
      ./stage/bin/psi4 ../tests/ddd-deriv/input.dat -o stdout
    displayName: 'Spot Test 2'

  - bash: |
      cd build
      source activate p4env
      python -V
      ls -l
      pwd
      python -c "import sys;print(sys.path)"
      echo ROUND1
      python -c "import qcelemental as q;print(q.util.which('psi4'))" || true
      psi4 --module || true
      python -c "import qcelemental as q;print(q.util.which_import('psi4'))" || true
      python -c "import psi4; print(psi4.executable)" || true
      echo ROUND1NG
      python -c "import qcengine as qcng; qcng.get_program('psi4')" || true
      echo ROUNDE
      PATH=stage/bin:$PATH python -c "import qcelemental as q;print(q.util.which('psi4'))" || true
      PATH=stage/bin:$PATH psi4 --module || true
      PATH=stage/bin:$PATH python -c "import qcelemental as q;print(q.util.which_import('psi4'))" || true
      PATH=stage/bin:$PATH python -c "import psi4; print(psi4.executable)" || true
      echo ROUNDE-NG
      PATH=stage/bin:$PATH python -c "import qcengine as qcng; qcng.get_program('psi4')" || true
      echo ROUNDP
      PYTHONPATH=stage/lib python -c "import qcelemental as q;print(q.util.which('psi4'))" || true
      PYTHONPATH=stage/lib psi4 --module || true
      PYTHONPATH=stage/lib python -c "import qcelemental as q;print(q.util.which_import('psi4'))" || true
      PYTHONPATH=stage/lib python -c "import psi4; print(psi4.executable)" || true
      echo ROUNDP-NG
      PYTHONPATH=stage/lib python -c "import qcengine as qcng; qcng.get_program('psi4')" || true
      echo ROUND4
      eval $(stage/bin/psi4 --psiapi)
      python -c "import qcelemental as q;print(q.util.which('psi4'))" || true
      psi4 --module || true
      python -c "import qcelemental as q;print(q.util.which_import('psi4'))" || true
      python -c "import psi4; print(psi4.executable)" || true
      echo ROUND4-NG
      python -c "import qcengine as qcng; qcng.get_program('psi4')" || true
    condition: false
    displayName: 'Psi4 Path Setup Diagnostics'
    # when "psi4 not found", use this to figure out what's wrong with QCEngine detection

  #- bash: |
  #    cd build
  #    source activate p4env
  #    PATH=stage/bin:$PATH PYTHONPATH=stage/lib/ pytest -k ITERATIVE ../tests/pytests
  #    PYTHONPATH=tests/plugins/skeleton ./stage/bin/psi4 ./tests/plugins/skeleton/skeleton/input.dat -o stdout
  #  displayName: 'Spot Test 2'

  - bash: |
      cd build
      source activate p4env
      if [[ -n "${LIBSTDCXX_SO:-}" ]]; then export LD_PRELOAD="${LIBSTDCXX_SO}"; fi
      python ../devtools/scripts/ci_run_test.py
      python ../devtools/scripts/ci_print_failing.py
    displayName: 'CTest Tests'

  - bash: |
      cd build
      source activate p4env
      if [[ -n "${LIBSTDCXX_SO:-}" ]]; then export LD_PRELOAD="${LIBSTDCXX_SO}"; fi
      PYTHONPATH=stage/lib/ pytest -v -rws --durations=15 --durations-min=40 --strict-markers --color yes -n 2 -m "$PYTEST_MARKER_EXPR" -k "$PYTEST_NAME_EXPR" stage/lib/psi4/tests/
    displayName: 'PyTest Tests'

# setuptools v66 (vendors packaging v23) incompatible with arb. tarballs. thinks the branch names are versions
